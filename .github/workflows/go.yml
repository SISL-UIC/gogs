name: Go
env:
  GOPROXY: https://proxy.golang.org
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
permissions:
  contents: read
jobs:
  lint:
    permissions:
      contents: read
      pull-requests: read
    name: Lint
    runs-on: self-hosted
    steps:
    - name: Check out code
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
    - name: Install Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version: 1.26.x
    - name: Check Go module tidiness and generated files
      shell: bash
      run: |
        go mod tidy
        go generate ./...
        STATUS=$(git status --porcelain)
        if [ ! -z "$STATUS" ]; then
          echo "Unstaged files:"
          echo $STATUS
          echo "Run 'go mod tidy' or 'go generate ./...' and commit them"
          exit 1
        fi
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa
      with:
        version: latest
        args: --timeout=30m
    timeout-minutes: 6
  test:
    name: Test
    strategy:
      matrix:
        include:
        - go-version: 1.26.x
          platform: ubuntu-latest
      fail-fast: false
    runs-on: self-hosted
    steps:
    - name: Check out code
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
    - name: Install Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Run tests with coverage
      run: |
        go test -shuffle=on -v -race -coverprofile=coverage -covermode=atomic -json ./... > test-report.json
        go install github.com/mfridman/tparse@latest
        tparse -all -file=test-report.json
    - name: Send email on failure
      uses: unknwon/send-email-on-failure@89339a1bc93f4ad1d30f3b7e4911fcba985c9adb
      if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        }}
      with:
        smtp_username: ${{ secrets.SMTP_USERNAME }}
        smtp_password: ${{ secrets.SMTP_PASSWORD }}
    timeout-minutes: 6
  test-windows:
    name: Test Windows
    strategy:
      matrix:
        go-version:
        - 1.26.x
        platform:
        - windows-latest
      fail-fast: false
    runs-on: self-hosted
    steps:
    - name: Check out code
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
    - name: Install Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Run tests with coverage
      run: go test -shuffle=on -v -coverprofile=coverage -covermode=atomic ./...
    - name: Send email on failure
      uses: unknwon/send-email-on-failure@89339a1bc93f4ad1d30f3b7e4911fcba985c9adb
      if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        }}
      with:
        smtp_username: ${{ secrets.SMTP_USERNAME }}
        smtp_password: ${{ secrets.SMTP_PASSWORD }}
    timeout-minutes: 6
  postgres:
    name: Postgres
    strategy:
      matrix:
        go-version:
        - 1.26.x
        platform:
        - ubuntu-latest
      fail-fast: false
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:9.6
        env:
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
        - 5432:5432
    steps:
    - name: Check out code
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
    - name: Install Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Run tests with coverage
      run: |
        go test -shuffle=on -v -race -coverprofile=coverage -covermode=atomic -json ./internal/database/... > test-report.json
        go install github.com/mfridman/tparse@latest
        tparse -all -file=test-report.json
      env:
        GOGS_DATABASE_TYPE: postgres
        PGPORT: 5432
        PGHOST: localhost
        PGUSER: postgres
        PGPASSWORD: postgres
        PGSSLMODE: disable
    timeout-minutes: 6
  mysql:
    name: MySQL
    strategy:
      matrix:
        go-version:
        - 1.26.x
        platform:
        - ubuntu-22.04
      fail-fast: false
    runs-on: self-hosted
    steps:
    - name: Start MySQL server
      run: sudo systemctl start mysql
    - name: Check out code
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
    - name: Install Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Run tests with coverage
      run: |
        go test -shuffle=on -v -race -coverprofile=coverage -covermode=atomic -json ./internal/database/... > test-report.json
        go install github.com/mfridman/tparse@latest
        tparse -all -file=test-report.json
      env:
        GOGS_DATABASE_TYPE: mysql
        MYSQL_USER: root
        MYSQL_PASSWORD: root
        MYSQL_HOST: localhost
        MYSQL_PORT: 3306
    timeout-minutes: 6
'on':
  push:
    branches:
    - main
    - release/**
    paths:
    - '**.go'
    - go.mod
    - .golangci.yml
    - .github/workflows/go.yml
  pull_request:
    paths:
    - '**.go'
    - go.mod
    - .golangci.yml
    - .github/workflows/go.yml
